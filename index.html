<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main>
    <h1>QuickNotes</h1>

    <button id="load-btn" type="button">Load notes</button>
    <p id="status"></p>

    <form id="note-form" novalidate>
      <label for="title-input">Title</label>
      <input type="text" id="title-input" placeholder="Note title (max 100 characters)">

      <label for="body-input">Body</label>
      <textarea id="body-input" placeholder="Write your note..."></textarea>

      <button type="submit" id="submit-btn">Add note</button>
    </form>

    <ul id="notes-list"></ul>
  </main>
</body>
</html>
